name: Build Samsung S9/S9+/Note9 Dual Kernel (KSUN+SuSFS & Vanilla)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Target Device"
        required: true
        default: "starlte"
        type: choice
        options:
          - starlte
          - star2lte
          - crownlte
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: build-s9-${{ github.ref }}-${{ inputs.device || 'starlte' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }} for ${{ inputs.device || 'starlte' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [ksun_susfs, vanilla]

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          sudo apt-get clean || true
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            build-essential ca-certificates ccache clang cpio flex \
            gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi g++ git \
            libelf-dev libssl-dev lld make patch pahole perl \
            python3 python-is-python3 rsync unzip zip
          echo "/usr/lib/ccache" >> $GITHUB_PATH

          echo "===== TOOLCHAIN VERSIONS ====="
          clang --version
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-as --version
          aarch64-linux-gnu-ld.bfd --version

      - name: Setup Build Environment & Defconfig
        id: setup
        run: |
          set -e
          DEVICE="${{ inputs.device }}"
          DEVICE="${DEVICE:-starlte}"
          VARIANT="${{ matrix.variant }}"

          case "$DEVICE" in
            starlte)
              DEVICE_DEFCONFIG="exynos9810-starlte_defconfig"
              ;;
            star2lte)
              DEVICE_DEFCONFIG="exynos9810-star2lte_defconfig"
              ;;
            crownlte)
              DEVICE_DEFCONFIG="exynos9810-crownlte_defconfig"
              ;;
            *)
              echo "Unsupported device: $DEVICE"
              exit 1
              ;;
          esac

          TEMP_DEFCONFIG="exynos9810_temp_defconfig"
          cat "arch/arm64/configs/exynos9810_defconfig" "arch/arm64/configs/$DEVICE_DEFCONFIG" > "arch/arm64/configs/$TEMP_DEFCONFIG"

          echo "CONFIG_ANDROID=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
          echo "CONFIG_ANDROID_BINDER_IPC=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
          echo "CONFIG_ANDROID_LOW_MEMORY_KILLER=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
          echo "CONFIG_EXYNOS_DTBTOOL=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
          echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
          echo "CONFIG_BCM4361=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"

          if [ "$VARIANT" = "ksun_susfs" ]; then
            echo "CONFIG_KSU=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "CONFIG_KSU_SUSFS=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            ZIP_NAME="ss-S9-${DEVICE}-A13-KSUN_SUSFS_GHOST_FULL-AnyKernel.zip"
            AK_STRING="ss-S9 Pixel Experience Android 13 Ghost Uptime + KSU Next + SuSFS"
          else
            echo "# CONFIG_KSU is not set" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            echo "# CONFIG_KSU_SUSFS is not set" >> "arch/arm64/configs/$TEMP_DEFCONFIG"
            ZIP_NAME="ss-S9-${DEVICE}-A13-VANILLA_GHOST_FULL-AnyKernel.zip"
            AK_STRING="ss-S9 Android 13 VANILLA GHOST FULL (Ghost Uptime + Headless + Always-On)"
          fi

          echo "DEVICE=$DEVICE" >> $GITHUB_ENV
          echo "TEMP_DEFCONFIG=$TEMP_DEFCONFIG" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "AK_STRING=$AK_STRING" >> $GITHUB_ENV
          echo "VARIANT=$VARIANT" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export AS=aarch64-linux-gnu-as
          export LD=aarch64-linux-gnu-ld.bfd
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          export READELF=aarch64-linux-gnu-readelf
          export PLATFORM_VERSION="12"
          export ANDROID_MAJOR_VERSION="s"
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export KCFLAGS='-Wno-default-const-init-field-unsafe -Wno-default-const-init-var-unsafe -Wno-single-bit-bitfield-constant-conversion -Wno-unused-function -Wno-error=visibility -Wno-strict-prototypes -Wno-error=strict-prototypes -Wno-error=implicit-int -Wno-deprecated-non-prototype'
          export KBUILD_CFLAGS='-Wno-default-const-init-field-unsafe -Wno-default-const-init-var-unsafe -Wno-single-bit-bitfield-constant-conversion -Wno-unused-function -Wno-error=visibility -Wno-strict-prototypes -Wno-error=strict-prototypes -Wno-error=implicit-int -Wno-deprecated-non-prototype'
          export KBUILD_BUILD_USER=android-build
          export KBUILD_BUILD_HOST=google.com
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_TIMESTAMP="Fri Aug 14 18:30:00 UTC 2026"

          MAKE_ARGS=(
            V=0
            ARCH=arm64
            SUBARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            "CC=clang --target=aarch64-linux-gnu --prefix=/usr/bin/aarch64-linux-gnu- -no-integrated-as"
            HOSTCC=gcc
            HOSTCXX=g++
            AS=aarch64-linux-gnu-as
            LD=aarch64-linux-gnu-ld.bfd
            AR=aarch64-linux-gnu-ar
            NM=aarch64-linux-gnu-nm
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=aarch64-linux-gnu-objdump
            STRIP=aarch64-linux-gnu-strip
            READELF=aarch64-linux-gnu-readelf
            PLATFORM_VERSION="12"
            ANDROID_MAJOR_VERSION="s"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
            KCFLAGS="${KCFLAGS}"
            KBUILD_BUILD_USER=android-build
            KBUILD_BUILD_HOST=google.com
            KBUILD_BUILD_VERSION=1
            KBUILD_BUILD_TIMESTAMP="Fri Aug 14 18:30:00 UTC 2026"
          )

          echo "===== GENERATING DEFCONFIG ====="
          make "${MAKE_ARGS[@]}" "$TEMP_DEFCONFIG" 2>&1 | tee defconfig.log
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee olddefconfig.log

          if [ "$VARIANT" = "ksun_susfs" ]; then
            python3 - <<'PYCONFIG'
from pathlib import Path
p = Path('.config')
text = p.read_text(errors='ignore').splitlines()
set_y = {
    'CONFIG_KSU', 'CONFIG_KSU_MANUAL_HOOK', 'CONFIG_KSU_SUSFS',
    'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT', 'CONFIG_KSU_SUSFS_SUS_PATH',
    'CONFIG_KSU_SUSFS_SUS_MOUNT', 'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT',
    'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT', 'CONFIG_KSU_SUSFS_TRY_UMOUNT',
    'CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT',
    'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS'
}
set_n = {
    'CONFIG_KSU_DEBUG', 'CONFIG_KSU_DISABLE_MANAGER', 'CONFIG_KSU_DISABLE_POLICY',
    'CONFIG_KSU_ALLOWLIST_WORKAROUND', 'CONFIG_KSU_KPROBES_HOOK', 'CONFIG_KSU_KPROBE_HOOKS',
    'CONFIG_KSU_SUSFS_ENABLE_LOG', 'CONFIG_KSU_SUSFS_SUS_KSTAT', 'CONFIG_KSU_SUSFS_SUS_OVERLAYFS',
    'CONFIG_KSU_SUSFS_SPOOF_UNAME', 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG',
    'CONFIG_KSU_SUSFS_OPEN_REDIRECT', 'CONFIG_KSU_SUSFS_SUS_SU'
}
keys = set_y | set_n
out = []
for line in text:
    stripped = line.strip()
    key = None
    if stripped.startswith('CONFIG_') and '=' in stripped:
        key = stripped.split('=', 1)[0]
    elif stripped.startswith('# CONFIG_') and stripped.endswith(' is not set'):
        key = stripped.split()[1]
    if key in keys:
        continue
    out.append(line)
out.append('')
for k in sorted(set_y): out.append(f'{k}=y')
for k in sorted(set_n): out.append(f'# {k} is not set')
p.write_text('\n'.join(out) + '\n')
PYCONFIG
            make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a olddefconfig.log
          else
            python3 - <<'PYCONFIG'
from pathlib import Path
p = Path('.config')
text = p.read_text(errors='ignore').splitlines()
set_n = {
    'CONFIG_KSU', 'CONFIG_KSU_DEBUG', 'CONFIG_KSU_MANUAL_HOOK',
    'CONFIG_KSU_DISABLE_MANAGER', 'CONFIG_KSU_DISABLE_POLICY',
    'CONFIG_KSU_ALLOWLIST_WORKAROUND', 'CONFIG_KSU_KPROBES_HOOK',
    'CONFIG_KSU_KPROBE_HOOKS', 'CONFIG_KSU_SUSFS', 'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT',
    'CONFIG_KSU_SUSFS_SUS_PATH', 'CONFIG_KSU_SUSFS_SUS_MOUNT',
    'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT',
    'CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT', 'CONFIG_KSU_SUSFS_TRY_UMOUNT',
    'CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT',
    'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS', 'CONFIG_KSU_SUSFS_ENABLE_LOG',
    'CONFIG_KSU_SUSFS_SUS_KSTAT', 'CONFIG_KSU_SUSFS_SUS_OVERLAYFS',
    'CONFIG_KSU_SUSFS_SPOOF_UNAME', 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG',
    'CONFIG_KSU_SUSFS_OPEN_REDIRECT', 'CONFIG_KSU_SUSFS_SUS_SU'
}
out = []
for line in text:
    stripped = line.strip()
    key = None
    if stripped.startswith('CONFIG_') and '=' in stripped:
        key = stripped.split('=', 1)[0]
    elif stripped.startswith('# CONFIG_') and stripped.endswith(' is not set'):
        key = stripped.split()[1]
    if key in set_n:
        continue
    out.append(line)
out.append('')
for k in sorted(set_n): out.append(f'# {k} is not set')
p.write_text('\n'.join(out) + '\n')
PYCONFIG
            make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a olddefconfig.log
          fi

          echo "===== CONFIG VERIFICATION ====="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS" .config || true

          echo "===== COMPILING KERNEL =====\"
          make -j$(nproc) "${MAKE_ARGS[@]}" Image Image.gz dtbs dtb.img 2>&1 | tee build.log
          if [ ! -f "arch/arm64/boot/dtb.img" ]; then
            make -j$(nproc) "${MAKE_ARGS[@]}" V=1 dtb.img 2>&1 | tee -a build.log
          fi

      - name: Package AnyKernel3
        run: |
          set -e
          cp -fv arch/arm64/boot/Image AnyKernel3/zImage
          cp -fv arch/arm64/boot/dtb.img AnyKernel3/dtb.img

          sed -i "s/kernel.string=.*/kernel.string=${AK_STRING}/" AnyKernel3/anykernel.sh

          case "$DEVICE" in
            star2lte)
              sed -i 's/starlte/star2lte/g' AnyKernel3/anykernel.sh
              sed -i 's/SM-G960/SM-G965/g' AnyKernel3/anykernel.sh
              ;;
            crownlte)
              sed -i 's/starlte/crownlte/g' AnyKernel3/anykernel.sh
              sed -i 's/SM-G960/SM-N960/g' AnyKernel3/anykernel.sh
              ;;
          esac

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder
          cd ..
          sha256sum "${ZIP_NAME}" | tee "${ZIP_NAME}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          retention-days: 30

      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ matrix.variant }}-${{ env.DEVICE }}
          path: |
            *.log
            .config
          if-no-files-found: ignore
          retention-days: 7
